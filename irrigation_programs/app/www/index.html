<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irrigation Programs</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="drop"></span>Irrigation</div>
  <nav class="tabs" id="tabs">
    <button data-tab="live" class="on">Live</button>
    <button data-tab="programs">Programs</button>
    <button data-tab="blocks">Blocks</button>
    <button data-tab="mainlines">Mainlines</button>
    <button data-tab="setup">Setup<span class="dot" id="setup-dot" hidden></span></button>
  </nav>
  <div class="top-actions">
    <button class="btn ghost" id="pause-all">Pause all</button>
    <button class="btn ghost" id="resume-all">Resume all</button>
  </div>
</header>

<main>
  <section id="view-live" class="view"></section>
  <section id="view-programs" class="view" hidden></section>
  <section id="view-blocks" class="view" hidden></section>
  <section id="view-mainlines" class="view" hidden></section>
  <section id="view-setup" class="view" hidden></section>
</main>

<div class="savebar" id="savebar" hidden>
  <div class="savebar-inner">
    <div class="savebar-msg">
      <strong id="save-title">Unsaved changes</strong>
      <button class="link" id="issues-toggle" hidden></button>
      <ul class="issues" id="issues" hidden></ul>
    </div>
    <div class="savebar-btns">
      <button class="btn ghost" id="discard">Discard</button>
      <button class="btn primary" id="save">Save &amp; apply</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="modal-bg" id="modal" hidden><div class="modal" id="modal-box"></div></div>

<script src="static/app.js"></script>
</body>
</html>
